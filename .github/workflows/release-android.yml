name: Build Android APK and publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        default: "v0.1.0"
      api_base:
        description: "HTTPS backend API URL, for example https://api.example.com/api"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    env:
      VITE_NATIVE_APP: "true"
      VITE_API_BASE: ${{ inputs.api_base || vars.VITE_API_BASE || 'http://192.168.31.128:3000/api' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci

      - name: Build and sync Android project
        run: npm run build:android

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare release file
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "LoveDiary-${VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: 恋爱日记 ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          generate_release_notes: true
          prerelease: true
          files: LoveDiary-*.apk
